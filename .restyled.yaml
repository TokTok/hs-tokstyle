---
restylers:
  - pyment:
      enabled: false
  - reorder-python-imports:
      enabled: false
  - yapf:
      enabled: false
  - astyle:
      image: ghcr.io/toktok/restyler-astyle:v3.6.2
  - autopep8:
      image: ghcr.io/toktok/restyler-autopep8:v2.3.2
  - black:
      image: ghcr.io/toktok/restyler-black:v26.10.1
  - prettier:
      image: ghcr.io/toktok/restyler-prettier:v3.9.10-6
  - prettier-markdown:
      image: ghcr.io/toktok/restyler-prettier:v3.9.10-6
  - prettier-yaml:
      image: ghcr.io/toktok/restyler-prettier:v3.9.10-6
  - shellharden:
      image: ghcr.io/toktok/restyler-shellharden:v4.3.2
  - shfmt:
      image: ghcr.io/toktok/restyler-shfmt:v3.14.1
  - "*"
